<head>
  <title>Butterchurn SRGB</title>
  <meta description="Winamp-like music visualizer using Butterchurn" />
  <meta publisher="ferretwithaberet" />

  <meta
    property="Preset"
    label="Preset"
    type="list"
    values="# Random,_Aderrasi - Wanderer in Curved Space - mash0000 - faclempt kibitzing meshuggana schmaltz (Geiss color mix),_Geiss - Artifact 01,_Geiss - untitled,_Mig_085,＄＄＄ Royal - Mashup (197),＄＄＄ Royal - Mashup (220),＄＄＄ Royal - Mashup (431),Aderrasi - Potion of Spirits,Aderrasi - Storm of the Eye (Thunder) - mash0000 - quasi pseudo meta concentrics,An AdamFX n Martin Infusion 2 flexi - Why The Sky Looks Diffrent Today - AdamFx n Martin Infusion - Tack Tile Disfunction B,Cope - The Neverending Explosion of Red Liquid Fire,cope + flexi - colorful marble (ghost mix),Eo.S. - glowsticks v2 05 and proton lights (+Krash′s beat code) _Phat_remix02b,fiShbRaiN + Flexi - witchcraft 2.0,Flexi٬ fishbrain٬ Geiss + Martin - tokamak witchery,Flexi٬ martin + geiss - dedicated to the sherwin maxawow,Geiss - Reaction Diffusion 2,Geiss - Spiral Artifact,Geiss - Thumb Drum,Geiss٬ Flexi + Stahlregen - Thumbdrum Tokamak [crossfiring aftermath jelly mashup],Goody - The Wild Vort,gunthry is out back bloodying up the pine trees - adm atomising (v) the disintigrate (n),Halfbreak - Funny Madness,Hexcollie٬ Pieturp٬ Orb٬ Flexi٬ Geiss n Demon Lord - Premeditative Urination Clause,LuxXx - Play v3 (the war within all of us),Martin - acid wiring,martin - angel flight,martin - another kind of groove,martin - bombyx mori,Martin - charisma,martin - disco mix 4,martin - extreme heat,martin - frosty caves 2,martin - fruit machine,martin - mucus cervix,martin - reflections on black tiles,martin - stormy sea (2010 update),martin - The Bridge of Khazad-Dum,martin - witchcraft reloaded,martin [shadow harlequins shape code] - fata morgana,martin + flexi - diamond cutter [prismaticvortex.com] - camille - i wish i wish i wish i was constrained,martin٬ flexi٬ fishbrain + sto - enterstate [random mashup],Milk Artist At our Best - FED - SlowFast Ft AdamFX n Martin - HD CosmoFX,MilkDrop2077.R033,ORB - Waaa,Rovastar - Oozing Resistance,Rovastar + Loadus + Geiss - FractalDrop (Triple Mix),sawtooth grin roam,ShadowHarlequin - LovelyShinySquares [ liquid starburst rmx ] - unchained + rovaster - luckless - martin - starfield sector,shifter - escape (sigur ros),suksma - ed geining hateops - squeakers,suksma - heretical crosscut playpen,suksma - Rovastar - Sunflower Passion (Enlightment Mix)_Phat_edit + flexi und martin shaders - circumflex in character classes in regular expression,suksma - uninitialized variabowl (hydroponic chronic),suksma - vector exp 1 - couldn′t not,TonyMilkdrop - Leonardo Da Vinci's Balloon [Flexi - merry-go-round + techstyle],TonyMilkdrop - Magellan's Nebula [Flexi - you enter first + multiverse],Unchained - Rewop,Unchained - Unified Drag 2,yin - 393 - Artificial Inspiration (music driven - outward),Zylot - Paint Spill (Music Reactive Paint Mix),Zylot - Star Ornament,Zylot - True Visionary (Final Mix)"
    default="# Random"
  />

  <meta
    property="RandomSeconds"
    label="Random change interval (seconds)"
    type="number"
    default="15"
    min="1"
    max="60"
  />

  <meta
    property="BlendSeconds"
    label="Time to blend (seconds)"
    type="number"
    default="2"
    min="0"
    max="10"
  />

  <meta
    property="PauseMode"
    label="Pause mode"
    type="list"
    values="None,Pause canvas"
    default="None"
  />

  <!--
  Pause mode "Fade to color", canvas slowly fades to FadeColor on pause

  <meta
    property="FadeColor"
    label="Fade color"
    type="color"
    default="#000000"
    min="0"
    max="360"
  /> -->

  <meta
    property="Amplify"
    label="Amplify"
    tooltip="Each frequency is multiplied with this value / 10, e.g. 1 = 0.1, 10 = 1.0, 20 = 2.0"
    type="number"
    default="5"
    min="1"
    max="20"
  />

  <meta property="RGBModeEnabled" label="Enable RGB mode" type="boolean" default="0" />

  <meta property="RGBModeSpeed" label="RGB mode speed" type="number" default="5" min="1" max="10" />

  <meta
    property="BlendMode"
    label="Blend mode"
    type="list"
    values="None,normal,multiply,screen,overlay,darken,lighten,color-dodge,color-burn,hard-light,soft-light,difference,exclusion,hue,saturation,color,luminosity,plus-darker,plus-lighter"
    default="None"
  />

  <meta
    property="BlendColor"
    label="Blend color"
    type="color"
    default="#00ff00"
    min="0"
    max="360"
  />

  <meta
    property="HueShift"
    label="Hue shift"
    tooltip="Ignored if RGB mode is on"
    type="hue"
    default="0"
    min="0"
    max="360"
  />

  <meta property="Saturation" label="Saturation" type="number" default="0" min="-100" max="100" />

  <meta property="Contrast" label="Contrast" type="number" default="0" min="-100" max="100" />

  <meta property="ShowPresetTitle" label="Show preset title" type="boolean" default="0" />
</head>

<body>
  <div id="wrapper">
    <canvas id="canvas" width="320" height="200"></canvas>
    <div class="blend-mode"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
