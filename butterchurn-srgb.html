<head>
  <title>Butterchurn SRGB</title>
  <meta description="Winamp-like music visualizer using Butterchurn" />
  <meta publisher="ferretwithaberet" />

  <meta
    property="Preset"
    label="Preset"
    type="list"
    values="# All,# Ranges,# None,{{INSERT_PRESETS}}"
    default="# All"
  />

  <meta
    property="PresetRanges"
    label="Preset ranges"
    tooltip="Preset index or range of indexes, comma separated. E.g. 1, 2, 3-6"
    type="textfield"
    default=""
  />

  <meta
    property="ExtraPresets"
    label="Extra presets URLs"
    tooltip="URLs to the extra presets' JSON files to use, separated with ||"
    type="textfield"
    default=""
  />

  <meta
    property="Mode"
    label="Mode"
    tooltip="Only used if more than one preset is selected"
    type="list"
    values="Cycle,Random"
    default="Random"
  />

  <meta
    property="ModeSeconds"
    label="Next preset interval (seconds)"
    type="number"
    default="15"
    min="1"
    max="60"
  />

  <meta
    property="BlendSeconds"
    label="Time to blend (seconds)"
    type="number"
    default="2"
    min="0"
    max="10"
  />

  <meta
    property="PauseMode"
    label="Pause mode"
    type="list"
    values="# None,Pause canvas"
    default="# None"
  />

  <!--
  Pause mode "Fade to color", canvas slowly fades to FadeColor on pause

  <meta
    property="FadeColor"
    label="Fade color"
    type="color"
    default="#000000"
    min="0"
    max="360"
  /> -->

  <meta
    property="Amplify"
    label="Amplify"
    tooltip="Each frequency is multiplied with this value / 10, e.g. 1 = 0.1, 10 = 1.0, 20 = 2.0"
    type="number"
    default="5"
    min="1"
    max="20"
  />

  <meta property="RGBModeEnabled" label="Enable RGB mode" type="boolean" default="0" />

  <meta property="RGBModeSpeed" label="RGB mode speed" type="number" default="5" min="1" max="10" />

  <meta
    property="BlendColorMode"
    label="Blend mode"
    type="list"
    values="# None,normal,multiply,screen,overlay,darken,lighten,color-dodge,color-burn,hard-light,soft-light,difference,exclusion,hue,saturation,color,luminosity,plus-darker,plus-lighter"
    default="# None"
  />

  <meta
    property="BlendColor"
    label="Blend color"
    type="color"
    default="#00ff00"
    min="0"
    max="360"
  />

  <meta
    property="BlendImageMode"
    label="Image blend mode"
    type="list"
    values="# None,normal,multiply,screen,overlay,darken,lighten,color-dodge,color-burn,hard-light,soft-light,difference,exclusion,hue,saturation,color,luminosity,plus-darker,plus-lighter"
    default="# None"
  />

  <meta property="BlendImage" label="Blend image URL" type="textfield" default="" />

  <meta
    property="HueShift"
    label="Hue shift"
    tooltip="Ignored if RGB mode is on"
    type="hue"
    default="0"
    min="0"
    max="360"
  />

  <meta property="Saturation" label="Saturation" type="number" default="0" min="-100" max="100" />

  <meta property="Contrast" label="Contrast" type="number" default="0" min="-100" max="100" />

  <meta property="ShowPresetTitle" label="Show preset title" type="boolean" default="0" />
</head>

<body>
  <div id="wrapper">
    <canvas id="canvas" width="320" height="200"></canvas>
    <img id="blend-image" class="blend-mode" />
    <div id="blend-color" class="blend-mode"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
